# Selected main method: v03 training settings without crossover.
# Parent gavdac_ea_tune_v03_long remains immutable for historical comparisons.
# Keep selection, elite/parent inheritance, mutation and RL population injection.
name: "gavdac_ea_main"
batch_size: 128
rnn_hidden_dim: 48
mixing_embed_dim: 32
test_interval: 10000
buffer_size: 50000
save_model_interval: 50000
t_max: 6000000
crossover_prob: 0.0
