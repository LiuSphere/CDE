# --- Shared FACMAC training options ---
batch_size_run: 1
batch_size: 512
buffer_size: 100000
buffer_warmup: 512
learner_update_interval: 2
learner_updates_per_episode: 1
ea_learner_updates: 3
use_cuda: false
t_max: 3e6

# --- Evaluation and logging ---
test_nepisode: 8
test_interval: 2000
log_interval: 2000
runner_log_interval: 2000
learner_log_interval: 2000
wandb_project: "gde-microgrid"
wandb_entity: ~
wandb_mode: "online"
wandb_dir: "results/wandb"
# Upload aggregate analysis metrics only; full diagnostics remain in local logs.
wandb_metric_patterns:
  - "eval/*"
  - "loss/*"
  - "*/return_mean"
  - "*/return_std"
  - "*/full_cost"
  - "*/baseline_full_cost"
  - "*/full_cost_saving"
  - "*/battery_charge_energy"
  - "*/battery_discharge_energy"
  - "*/mean_soc"
  - "*/soc_violation"
  - "*/battery_action_clip"
  - "*/generator_energy"
  - "*/grid_import_energy"
  - "*/peer_sent_energy"
  - "*/exchange_loss_energy"
  - "*/spill_energy"
# Selected validation best cases are plotted only after normal training completion.
showcase_enabled: true
showcase_days: 2
showcase_candidate_rows: [740, 766, 808, 862, 880, 904]
showcase_soc_tolerance: 0.03
save_model: true
save_model_interval: 10000
checkpoint_path: ""
evaluate: false
load_step: 0
local_results_path: "results"
save_best_policy: true
fixed_eval_days: 8
validation_rows: []
typical_day_rows: []
evaluation_initial_soc: 0.35
policy_checkpoint: ""
evaluation_output_id: ""

# --- FACMAC optimization ---
gamma: 0.99
lr: 3e-4
critic_lr: 1e-4
optimizer: "adam"
grad_norm_clip: 5
recurrent_critic: false
target_update_mode: "soft"
target_update_tau: 0.002

# --- Continuous policy and graph mixer ---
rnn_hidden_dim: 64
obs_agent_id: true
obs_last_action: true
exploration_mode: "gaussian"
start_steps: 1000
act_noise: 0.05
mixing_embed_dim: 64
hypernet_embed: 64
mixer_weight_scale: 0.1

# --- Evolutionary augmentation ---
# These values are still required when EA is disabled because the run loop
# constructs its evolver before branching on EA.
EA: true
pop_size: 5
elite_fraction: 0.2
mutation_prob: 0.9
crossover_prob: 1.0
prob_reset_and_sup: 0.05
frac: 1.0
SAME: false
start_timesteps: 10000
EA_freq: 5
ea_generations_per_cycle: 1
ea_log_interval: 10
