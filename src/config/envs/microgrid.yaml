# microgrid.yaml
env: "microgrid"
env_args:
  # maenv_sep.py uses standardized data and an implicit one-hour step.
  time_step_hours: 1.0
  result_dir: "./results"
  log_trajectories: false
  log_trajectories_mode: "test"
  # Equipment and declared bounds match IPPO4CPT/envs/MG/env_config.json.
  # Confirmed: use maenv_sep.py's single-objective branch for FACMAC,
  # not the reference file's multi_target=True setting.
  # Security fields are inactive in the reference maenv_sep.py as well.
  security_matrix: [[1.23, -0.55, -0.68], [-0.55, 1.47, -0.92], [-0.68, -0.92, 1.60]]
  v_slack: [220, 220, 220]
  data:
    - agent_name: "agent1"
      env_name: "mg1"
      split_ratio: 0.3
      low_state: [0.0, 0.0, 0.0, -1.0]
      high_state: [1.0, 1.0, 1.0, 1.0]
      low_action: [0.0, -1.0]
      high_action: [1.0, 1.0]
      dg_max: 225.0
      battery_cap: 100.0
      battery_punishment_param: 27.5
      raw_ch: 0.98
      raw_dis: 0.98
      bessa: 0.0152
      bessb: 5.61
      bessc: 24.0
      costa: 0.0083
      costb: 5.76
      costc: 64.0
      env_param: 1.6481
      v_ref: 175
      adm_matrix: 0
    - agent_name: "agent2"
      env_name: "mg2"
      split_ratio: 0.3
      low_state: [0.0, 0.0, 0.0, -1.0]
      high_state: [1.0, 1.0, 1.0, 1.0]
      low_action: [0.0, -1.0]
      high_action: [1.0, 1.0]
      dg_max: 225.0
      battery_cap: 100.0
      battery_punishment_param: 27.5
      raw_ch: 0.98
      raw_dis: 0.98
      bessa: 0.0158
      bessb: 5.63
      bessc: 34.0
      costa: 0.0079
      costb: 5.67
      costc: 357.0
      env_param: 1.6481
      v_ref: 205
      adm_matrix: 0
    - agent_name: "agent3"
      env_name: "mg3"
      split_ratio: 0.4
      low_state: [0.0, 0.0, 0.0, -1.0]
      high_state: [1.0, 1.0, 1.0, 1.0]
      low_action: [0.0, -1.0]
      high_action: [1.0, 1.0]
      dg_max: 180.0
      battery_cap: 100.0
      battery_punishment_param: 100.0
      raw_ch: 0.98
      raw_dis: 0.98
      bessa: 0.0172
      bessb: 5.72
      bessc: 37.0
      costa: 0.0096
      costb: 5.79
      costc: 104.0
      env_param: 1.6481
      v_ref: 190
      adm_matrix: 0
